########################################################
# SERVER CONFIGURATION
########################################################
server.port=8080

########################################################
# APPLICATION NAME
########################################################
spring.application.name=doms

########################################################
# DATABASE CONFIGURATION
########################################################
spring.datasource.url=jdbc:mysql://localhost:3306/doms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Jayesh@45
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

########################################################
# JPA / HIBERNATE CONFIGURATION
########################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

########################################################
# FILE UPLOAD CONFIGURATION
########################################################
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

########################################################
# JACKSON CONFIGURATION
########################################################
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

########################################################
# LOGGING
########################################################
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

########################################################
# JWT CONFIGURATION
########################################################
jwt.secret=ThisIsMyVerySecureSecretKeyForDOMSProject2026Jayesh
jwt.expiration=86400000