########################################################
# LOAD .ENV FILE
########################################################
spring.config.import=optional:file:.env[.properties]


########################################################
# SERVER CONFIGURATION
########################################################
server.port=${SERVER_PORT:8080}


########################################################
# APPLICATION NAME
########################################################
spring.application.name=doms


########################################################
# DATABASE CONFIGURATION - NEON POSTGRESQL
########################################################
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Neon/PgBouncer connections can reuse a server-side prepared statement after
# a schema update. Disable driver-side prepared statement caching so metadata
# queries do not fail with "cached plan must not change result type".
spring.datasource.hikari.data-source-properties.prepareThreshold=0


########################################################
# JPA / HIBERNATE CONFIGURATION
########################################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


########################################################
# FILE UPLOAD CONFIGURATION
########################################################
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


########################################################
# CLOUDINARY DOCUMENT STORAGE
########################################################
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:doms/documents}


########################################################
# JACKSON CONFIGURATION
########################################################
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false


########################################################
# LOGGING CONFIGURATION
########################################################
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


########################################################
# JWT CONFIGURATION
########################################################
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:1800000}


########################################################
# SMTP / EMAIL CONFIGURATION
########################################################
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


########################################################
# MAIL SENDER CONFIGURATION
########################################################
app.mail.from=${SMTP_FROM:${SMTP_USERNAME}}


########################################################
# OTP CONFIGURATION
########################################################
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
